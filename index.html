<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asfour Games | عصفور جيمز</title>
    <style>
        :root { --bg-color: #f3f4f6; --header-bg: #ffffff; --text-main: #1f2937; --text-light: #6b7280; --primary: #3b82f6; --card-radius: 16px; --header-height: 60px; --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1); --transition: all 0.2s ease-in-out; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background-color: var(--bg-color); color: var(--text-main); }
        body.no-scroll { overflow: hidden !important; }

        header { position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height); background: var(--header-bg); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 1000; box-shadow: var(--shadow-sm); }
        .header-logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 900; color: var(--text-main); text-decoration: none; }
        .header-logo svg { width: 28px; height: 28px; fill: var(--primary); }
        .header-search { flex-grow: 1; max-width: 400px; margin: 0 20px; position: relative; display: none; }
        @media (min-width: 768px) { .header-search { display: block; } }
        .search-input { width: 100%; background: #f3f4f6; border: none; padding: 10px 40px 10px 15px; border-radius: 20px; font-size: 14px; outline: none; }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: var(--text-light); pointer-events: none; }

        .header-actions { display: flex; align-items: center; gap: 12px; }
        .icon-btn { background: #f3f4f6; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .icon-btn svg { width: 18px; height: 18px; fill: var(--text-main); }
        #mobileSearchBtn { display: flex; }
        @media (min-width: 768px) { #mobileSearchBtn { display: none; } }
        .logged-in-dot { position: absolute; top: 0; right: 0; width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; border: 2px solid white; display: none; }

        main { margin-top: var(--header-height); padding: 15px; min-height: calc(100vh - var(--header-height)); min-height: calc(100dvh - var(--header-height)); padding-bottom: 50px; }

        .announcement { display: none; background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-bottom: 12px; text-align: center; }

        .mobile-search-bar { display: none; margin-bottom: 12px; position: relative; }
        .mobile-search-bar.open { display: block; }
        @media (min-width: 768px) { .mobile-search-bar, .mobile-search-bar.open { display: none; } }
        .mobile-search-bar .search-input { background: #fff; box-shadow: var(--shadow-sm); padding: 12px 40px 12px 15px; }

        .categories-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-pill { padding: 8px 16px; background: var(--header-bg); border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; box-shadow: var(--shadow-sm); }
        .cat-pill.active { background: var(--primary); color: white; }

        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 480px) { .games-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 768px) { .games-grid { grid-template-columns: repeat(4, 1fr); gap: 15px; } }
        @media (min-width: 1024px) { .games-grid { grid-template-columns: repeat(6, 1fr); gap: 20px; } }
        .grid-msg { text-align: center; grid-column: 1 / -1; color: gray; padding: 20px 0; }

        .game-card { display: flex; flex-direction: column; align-items: center; cursor: pointer; width: 100%; transition: var(--transition); }
        .game-card:hover .game-icon-wrapper { transform: translateY(-3px); }
        .game-icon-wrapper { width: 100%; aspect-ratio: 1 / 1; border-radius: var(--card-radius); overflow: hidden; background: #e5e7eb; position: relative; box-shadow: var(--shadow-md); transition: var(--transition); }
        .game-icon-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .badge-featured { position: absolute; top: 8px; right: 8px; background: #f59e0b; color: #fff; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 10px; }
        .game-title { margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--text-main); text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #player-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; background: var(--bg-color); z-index: 2000; overflow-y: auto; }
        .player-nav { height: var(--header-height); background: #111827; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; position: sticky; top: 0; z-index: 2001; }
        .player-back-btn { background: none; border: none; color: white; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .player-back-btn svg { width: 20px; height: 20px; fill: white; }
        .player-title { color: white; font-weight: bold; font-size: 16px; }
        .iframe-wrapper { width: 100%; height: calc(100vh - var(--header-height)); height: calc(100dvh - var(--header-height)); background: #000; position: relative; }
        .game-iframe { width: 100%; height: 100%; border: none; display: block; }
        .loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111827; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; color: white; }
        .loader-spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 3000; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; }
        .modal-box { background: var(--header-bg); width: 90%; max-width: 400px; border-radius: 24px; padding: 25px; position: relative; max-height: 90vh; max-height: 90dvh; overflow-y: auto; }
        .close-modal { position: absolute; top: 15px; left: 15px; background: #f3f4f6; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; color: var(--text-light); }

        .btn-google { width: 100%; background: white; color: var(--text-main); border: 1px solid #d1d5db; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; }
        .btn-google svg { width: 20px; height: 20px; }
        .auth-error { color: #ef4444; font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }

        .profile-header { text-align: center; margin-bottom: 25px; margin-top: 15px; }
        .profile-avatar { width: 80px; height: 80px; background: var(--primary); color: white; font-size: 32px; font-weight: bold; display: flex; justify-content: center; align-items: center; border-radius: 50%; margin: 0 auto 15px; overflow: hidden; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-size: 20px; font-weight: bold; color: var(--text-main); }
        .profile-email { font-size: 13px; color: var(--text-light); margin-top: 5px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #f3f4f6; padding: 15px; border-radius: 16px; text-align: center; border: 1px solid #e5e7eb; }
        .stat-val { font-size: 24px; font-weight: 900; color: var(--primary); margin-bottom: 5px; }
        .stat-label { font-size: 12px; font-weight: bold; color: var(--text-light); }
        .points-card { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; padding: 15px; border-radius: 16px; text-align: center; margin-bottom: 25px; }
        .points-val { font-size: 20px; font-weight: bold; }
        .btn-logout { width: 100%; background: transparent; color: #ef4444; border: 1px solid #fca5a5; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; }
        #profile-section { display: none; }

        #maintenance { display: none; position: fixed; inset: 0; background: #111827; color: #fff; z-index: 5000; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; gap: 10px; }
        #maintenance h2 { font-size: 24px; }
        #maintenance p { color: #9ca3af; }
    </style>
</head>
<body>

    <svg style="display: none;">
        <symbol id="icon-gamepad" viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
        <symbol id="icon-user" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></symbol>
        <symbol id="icon-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></symbol>
        <symbol id="icon-google" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></symbol>
    </svg>

    <div id="maintenance">
        <div style="font-size:48px;">🛠️</div>
        <h2>الموقع تحت الصيانة</h2>
        <p>هنرجع قريب، شكراً لصبرك!</p>
    </div>

    <div id="store-view">
        <header>
            <a href="#" class="header-logo" id="logoLink">
                <svg><use href="#icon-gamepad"></use></svg> asfour games 
            </a>
            <div class="header-search">
                <svg class="search-icon"><use href="#icon-search"></use></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن ألعاب..." autocomplete="off">
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="mobileSearchBtn" aria-label="بحث"><svg><use href="#icon-search"></use></svg></button>
                <button class="icon-btn" id="userBtn" aria-label="الحساب">
                    <svg><use href="#icon-user"></use></svg>
                    <div id="logged-in-dot" class="logged-in-dot"></div>
                </button>
            </div>
        </header>

        <main>
            <div class="announcement" id="announcement"></div>

            <div class="mobile-search-bar" id="mobileSearchBar">
                <svg class="search-icon"><use href="#icon-search"></use></svg>
                <input type="text" id="searchInputMobile" class="search-input" placeholder="ابحث عن ألعاب..." autocomplete="off">
            </div>

            <div class="categories-scroll" id="categories">
                <div class="cat-pill active" data-cat="all">الكل</div>
                <div class="cat-pill" data-cat="action">أكشن</div>
                <div class="cat-pill" data-cat="cars">سيارات</div>
                <div class="cat-pill" data-cat="puzzle">ذكاء وألغاز</div>
                <div class="cat-pill" data-cat="sports">رياضة</div>
                <div class="cat-pill" data-cat="adventure">مغامرات</div>
            </div>
            <div class="games-grid" id="main-grid">
                <p class="grid-msg">جاري تحميل الألعاب...</p>
            </div>
        </main>
    </div>

    <!-- شاشة اللعب -->
    <div id="player-view">
        <div class="player-nav">
            <button class="player-back-btn" id="exitGameBtn">
                <svg><use href="#icon-back"></use></svg> خروج من اللعبة
            </button>
            <div class="player-title" id="playerTitle">اسم اللعبة</div>
            <button class="player-back-btn" id="musicBtn" style="visibility:hidden;" aria-label="الموسيقى">🔊</button>
        </div>
        <div class="iframe-wrapper" id="gameContainer">
            <div class="loading-screen" id="loadingScreen">
                <div class="loader-spinner"></div>
                <div id="loadingText">جاري التجهيز...</div>
            </div>
            <iframe id="gameIframe" class="game-iframe" allowfullscreen
                allow="fullscreen; autoplay; gamepad"
                sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms"></iframe>
        </div>
    </div>

    <!-- شاشة الحساب -->
    <div class="modal-overlay" id="userModalOverlay">
        <div class="modal-box">
            <button class="close-modal" id="closeModalBtn" aria-label="إغلاق">✕</button>

            <div id="auth-section">
                <h3 style="text-align:center; margin-bottom:10px;">تسجيل الدخول للمنصة</h3>
                <p style="text-align:center; font-size:14px; color:var(--text-light);">سجل لحفظ تقدمك وجمع النقاط!</p>
                <button class="btn-google" id="googleLoginBtn">
                    <svg><use href="#icon-google"></use></svg> المتابعة باستخدام Google
                </button>
                <div class="auth-error" id="authError"></div>
            </div>

            <div id="profile-section">
                <div class="profile-header">
                    <div class="profile-avatar" id="user-avatar-letter"></div>
                    <div class="profile-name" id="user-display-name">بطل عصفور</div>
                    <div class="profile-email" id="user-display-email">لاعب مسجل</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-val" id="stat-games">0</div>
                        <div class="stat-label">ألعاب لعبتها</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="stat-mins">0</div>
                        <div class="stat-label">دقيقة لعب</div>
                    </div>
                </div>
                <div class="points-card">
                    <div class="points-val">⭐ <span id="stat-points">0</span> نقطة</div>
                </div>
                <div class="auth-error" id="banNote"></div>
                <button class="btn-logout" id="logoutBtn">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, serverTimestamp, writeBatch, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBNlJ-hiRIPKD4apbRbt331MSi5t0o2XGU",
            authDomain: "asfour-games.firebaseapp.com",
            projectId: "asfour-games",
            storageBucket: "asfour-games.firebasestorage.app",
            messagingSenderId: "232632114081",
            appId: "1:232632114081:web:d81e9100a68252038b09e0"
        };

        const ADMIN_EMAIL = 'asfour.games67@gmail.com';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const $ = (id) => document.getElementById(id);

        // ---------- الحالة ----------
        let currentUserData = null;
        let stats = { gamesPlayed: 0, playMinutes: 0, points: 0, banned: false };
        let globalGamesDB = [];
        let settings = {};
        let currentCat = 'all';
        let searchQuery = '';
        let playInterval = null;
        let playerOpen = false;
        let loadTimeout = null;
        let currentGame = null;      // { id, title }
        let playReady = false;       // وثيقة سجل اللعبة جاهزة
        const countedGames = new Set();

        function safeUrl(u) {
            try {
                const parsed = new URL(u, location.href);
                return (parsed.protocol === 'https:' || parsed.protocol === 'http:') ? parsed.href : '';
            } catch (e) { return ''; }
        }
        function safeImg(u) {
            if (typeof u === 'string' && /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(u)) return u;
            return safeUrl(u);
        }

        // ---------- الإعدادات (إعلان / صيانة) ----------
        onSnapshot(doc(db, "settings", "main"), (snap) => {
            settings = snap.exists() ? snap.data() : {};
            applySettings();
        }, () => {});

        function applySettings() {
            const text = String(settings.announcement || '').trim();
            const banner = $('announcement');
            banner.textContent = text;
            banner.style.display = text ? 'block' : 'none';
            const isAdmin = currentUserData && currentUserData.email === ADMIN_EMAIL;
            $('maintenance').style.display = (settings.maintenance && !isAdmin) ? 'flex' : 'none';
        }

        // ---------- جلب الألعاب ----------
        onSnapshot(collection(db, "games"), (snapshot) => {
            globalGamesDB = [];
            snapshot.forEach((docSnap) => {
                const game = docSnap.data();
                game.id = docSnap.id;
                globalGamesDB.push(game);
            });
            applyFilters();
        }, (err) => {
            console.error(err);
            showGridMessage("تعذر تحميل الألعاب. تأكد من الاتصال وحاول مرة تانية.");
        });

        function showGridMessage(text) {
            const grid = $('main-grid');
            grid.textContent = '';
            const p = document.createElement('p');
            p.className = 'grid-msg';
            p.textContent = text;
            grid.appendChild(p);
        }

        // ---------- الفلترة (بحث + تصنيف + إخفاء + ترتيب) ----------
        function applyFilters() {
            const q = searchQuery.trim().toLowerCase();
            const list = globalGamesDB.filter(g => {
                if (g.hidden) return false;
                const catOk = currentCat === 'all' || g.category === currentCat;
                const searchOk = !q || String(g.title || '').toLowerCase().includes(q);
                return catOk && searchOk;
            }).sort((a, b) => {
                if (!!b.featured !== !!a.featured) return b.featured ? 1 : -1;
                const oa = Number.isFinite(a.order) ? a.order : 9999;
                const ob = Number.isFinite(b.order) ? b.order : 9999;
                if (oa !== ob) return oa - ob;
                return String(a.title || '').localeCompare(String(b.title || ''), 'ar');
            });
            renderGamesGrid(list);
        }

        function renderGamesGrid(gamesList) {
            const container = $('main-grid');
            container.textContent = '';
            if (gamesList.length === 0) { showGridMessage("لا توجد ألعاب حالياً."); return; }

            gamesList.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.addEventListener('click', () => openPlayer(game));

                const wrap = document.createElement('div');
                wrap.className = 'game-icon-wrapper';
                const img = document.createElement('img');
                img.className = 'game-icon-img';
                img.src = safeImg(game.img);
                img.alt = game.title || '';
                img.loading = 'lazy';
                wrap.appendChild(img);

                if (game.featured) {
                    const badge = document.createElement('div');
                    badge.className = 'badge-featured';
                    badge.textContent = '⭐ مميزة';
                    wrap.appendChild(badge);
                }

                const title = document.createElement('div');
                title.className = 'game-title';
                title.textContent = game.title || '';

                card.append(wrap, title);
                container.appendChild(card);
            });
        }

        $('categories').addEventListener('click', (e) => {
            const pill = e.target.closest('.cat-pill');
            if (!pill) return;
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            pill.classList.add('active');
            currentCat = pill.dataset.cat;
            applyFilters();
        });

        function onSearchInput(e) {
            searchQuery = e.target.value;
            if (e.target.id === 'searchInput') $('searchInputMobile').value = searchQuery;
            else $('searchInput').value = searchQuery;
            applyFilters();
        }
        $('searchInput').addEventListener('input', onSearchInput);
        $('searchInputMobile').addEventListener('input', onSearchInput);

        $('mobileSearchBtn').addEventListener('click', () => {
            const bar = $('mobileSearchBar');
            bar.classList.toggle('open');
            if (bar.classList.contains('open')) $('searchInputMobile').focus();
        });

        $('logoLink').addEventListener('click', (e) => { e.preventDefault(); location.reload(); });

        // ---------- الحسابات ----------
        function setAuthError(msg) { $('authError').textContent = msg || ''; }

        $('googleLoginBtn').addEventListener('click', async () => {
            setAuthError('');
            try {
                await signInWithPopup(auth, provider);
            } catch (e) {
                const fallbackCodes = ['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/web-storage-unsupported'];
                if (fallbackCodes.includes(e.code)) {
                    try { await signInWithRedirect(auth, provider); }
                    catch (e2) { setAuthError("تعذر تسجيل الدخول. جرّب تفتح الموقع من متصفح عادي."); }
                } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
                    setAuthError("خطأ في التسجيل. حاول مرة تانية.");
                }
            }
        });

        getRedirectResult(auth).catch(() => setAuthError("تعذر إكمال تسجيل الدخول."));
        $('logoutBtn').addEventListener('click', () => { signOut(auth); });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserData = user;
                const name = user.displayName || 'لاعب';
                $('auth-section').style.display = 'none';
                $('profile-section').style.display = 'block';
                $('logged-in-dot').style.display = 'block';
                $('user-display-name').textContent = name;
                $('user-display-email').textContent = user.email || '';

                const avatar = $('user-avatar-letter');
                avatar.textContent = '';
                const photo = safeUrl(user.photoURL);
                if (photo) {
                    const im = document.createElement('img');
                    im.src = photo; im.alt = name;
                    avatar.appendChild(im);
                } else {
                    avatar.textContent = name.charAt(0);
                }

                try {
                    const userRef = doc(db, "users", user.uid);
                    const snap = await getDoc(userRef);
                    if (snap.exists()) {
                        stats = { gamesPlayed: 0, playMinutes: 0, points: 0, banned: false, ...snap.data() };
                        try {
                            await updateDoc(userRef, {
                                displayName: name,
                                email: user.email || '',
                                photoURL: user.photoURL || '',
                                lastLogin: serverTimestamp()
                            });
                        } catch (e) { /* محظور أو مفيش صلاحية: عادي */ }
                    } else {
                        await setDoc(userRef, {
                            displayName: name,
                            email: user.email || '',
                            photoURL: user.photoURL || '',
                            gamesPlayed: 0, playMinutes: 0, points: 50,
                            createdAt: serverTimestamp(),
                            lastLogin: serverTimestamp()
                        });
                        stats = { gamesPlayed: 0, playMinutes: 0, points: 50, banned: false };
                    }
                } catch (e) { console.error(e); }
                updateStatsUI();
                applySettings();

                if (playerOpen) { await recordGameOpen(); startTimer(); }
            } else {
                stopTimer();
                currentUserData = null;
                playReady = false;
                stats = { gamesPlayed: 0, playMinutes: 0, points: 0, banned: false };
                countedGames.clear();
                $('auth-section').style.display = 'block';
                $('profile-section').style.display = 'none';
                $('logged-in-dot').style.display = 'none';
                updateStatsUI();
                applySettings();
            }
        });

        function updateStatsUI() {
            $('stat-games').textContent = stats.gamesPlayed || 0;
            $('stat-mins').textContent = stats.playMinutes || 0;
            $('stat-points').textContent = stats.points || 0;
            $('banNote').textContent = stats.banned ? 'حسابك موقوف عن جمع النقاط.' : '';
        }

        // ---------- نافذة الحساب ----------
        function openUserModal() {
            const overlay = $('userModalOverlay');
            overlay.style.display = 'flex';
            document.body.classList.add('no-scroll');
            setTimeout(() => { overlay.classList.add('active'); }, 10);
        }
        function closeUserModal() {
            const overlay = $('userModalOverlay');
            overlay.classList.remove('active');
            setTimeout(() => {
                overlay.style.display = 'none';
                if (!playerOpen) document.body.classList.remove('no-scroll');
            }, 300);
        }
        $('userBtn').addEventListener('click', openUserModal);
        $('closeModalBtn').addEventListener('click', closeUserModal);
        $('userModalOverlay').addEventListener('click', (e) => { if (e.target.id === 'userModalOverlay') closeUserModal(); });

        // ---------- نظام اللعب والنقاط (10 نقط كل دقيقة) ----------
        function startTimer() {
            stopTimer();
            if (!currentUserData || !playerOpen || document.hidden || stats.banned) return;
            const uid = currentUserData.uid;
            playInterval = setInterval(async () => {
                if (document.hidden) return;
                try {
                    const batch = writeBatch(db);
                    batch.update(doc(db, "users", uid), {
                        playMinutes: increment(1),
                        points: increment(10),
                        lastTick: serverTimestamp()
                    });
                    if (playReady && currentGame) {
                        batch.update(doc(db, "users", uid, "plays", currentGame.id), {
                            minutes: increment(1),
                            lastPlayed: serverTimestamp()
                        });
                    }
                    await batch.commit();
                    stats.playMinutes = (stats.playMinutes || 0) + 1;
                    stats.points = (stats.points || 0) + 10;
                    updateStatsUI();
                } catch (e) { console.error("tick rejected", e); }
            }, 60000);
        }

        function stopTimer() {
            if (playInterval) { clearInterval(playInterval); playInterval = null; }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) stopTimer();
            else if (playerOpen) startTimer();
        });

        // تسجيل فتح اللعبة: سجل اللاعب + عداد الألعاب + عداد اللعبة
        async function recordGameOpen() {
            if (!currentUserData || !currentGame || stats.banned) return;
            const { id, title } = currentGame;
            const uid = currentUserData.uid;
            const first = !countedGames.has(id);
            playReady = false;

            const playRef = doc(db, "users", uid, "plays", id);
            try {
                const snap = await getDoc(playRef);
                if (!snap.exists()) {
                    await setDoc(playRef, { title: title || '', count: 1, minutes: 0, lastPlayed: serverTimestamp() });
                } else if (first) {
                    await updateDoc(playRef, { count: increment(1), lastPlayed: serverTimestamp() });
                }
                playReady = true;
            } catch (e) { console.error(e); }

            if (first) {
                countedGames.add(id);
                try {
                    await updateDoc(doc(db, "users", uid), { gamesPlayed: increment(1) });
                    stats.gamesPlayed = (stats.gamesPlayed || 0) + 1;
                    updateStatsUI();
                } catch (e) { console.error(e); }
                try { await updateDoc(doc(db, "games", id), { plays: increment(1) }); } catch (e) { /* مش مشكلة */ }
            }
        }

        const SANDBOX_LINK = 'allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms';
        const SANDBOX_ISOLATED = 'allow-scripts allow-pointer-lock allow-popups allow-forms';
        const uploadCache = new Map();
        let openToken = 0;
        let musicAudio = null, musicOn = true;

        // تجميع أجزاء ملف مخزّن في Firestore
        async function loadParts(id, kind, n, type) {
            const snaps = await Promise.all(Array.from({ length: n }, (_, i) => getDoc(doc(db, "gameFiles", id + '_' + kind + '_' + i))));
            const b64 = snaps.map(s => { if (!s.exists()) throw new Error('missing part'); return s.data().data; }).join('');
            const bin = atob(b64), bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new Blob([bytes], { type });
        }

        async function loadUploaded(game) {
            const key = game.id + ':' + (game.fileVer || 0);
            if (uploadCache.has(key)) return uploadCache.get(key);
            const [htmlBlob, musicBlob] = await Promise.all([
                loadParts(game.id, 'html', game.htmlParts || 0, 'text/html;charset=utf-8'),
                (game.hasMusic && game.musicParts) ? loadParts(game.id, 'music', game.musicParts, game.musicType || 'audio/mpeg') : Promise.resolve(null)
            ]);
            const res = { gameUrl: URL.createObjectURL(htmlBlob), musicUrl: musicBlob ? URL.createObjectURL(musicBlob) : '' };
            uploadCache.set(key, res);
            return res;
        }

        // ---------- الموسيقى ----------
        function stopMusic() {
            if (musicAudio) { musicAudio.pause(); musicAudio.removeAttribute('src'); musicAudio = null; }
            $('musicBtn').style.visibility = 'hidden';
        }
        function startMusic(url) {
            stopMusic();
            if (!url) return;
            musicAudio = new Audio(url);
            musicAudio.loop = true; musicAudio.volume = 0.5;
            const btn = $('musicBtn');
            btn.style.visibility = 'visible';
            btn.textContent = musicOn ? '🔊' : '🔇';
            if (musicOn) musicAudio.play().catch(() => { musicOn = false; btn.textContent = '🔇'; });
        }
        $('musicBtn').addEventListener('click', () => {
            if (!musicAudio) return;
            musicOn = !musicOn;
            $('musicBtn').textContent = musicOn ? '🔊' : '🔇';
            if (musicOn) musicAudio.play().catch(() => {}); else musicAudio.pause();
        });
        document.addEventListener('visibilitychange', () => {
            if (!musicAudio) return;
            if (document.hidden) musicAudio.pause();
            else if (musicOn) musicAudio.play().catch(() => {});
        });

        // ---------- فتح اللعبة ----------
        async function openPlayer(game) {
            const { id, title } = game;
            const isUpload = game.source === 'upload';
            const linkUrl = isUpload ? '' : safeUrl(game.url);
            if (!isUpload && !linkUrl) { alert("رابط اللعبة غير صالح."); return; }

            playerOpen = true;
            currentGame = { id, title };
            const token = ++openToken;
            document.body.classList.add('no-scroll');
            $('store-view').style.display = 'none';
            $('player-view').style.display = 'block';
            $('playerTitle').textContent = title || '';
            const frame = $('gameIframe');
            frame.src = "about:blank";
            frame.setAttribute('sandbox', isUpload ? SANDBOX_ISOLATED : SANDBOX_LINK);
            $('loadingText').textContent = 'جاري التجهيز...';
            $('loadingScreen').style.display = 'flex';
            clearTimeout(loadTimeout);
            stopMusic();

            startTimer();
            recordGameOpen();

            if (isUpload) {
                try {
                    const { gameUrl, musicUrl } = await loadUploaded(game);
                    if (token !== openToken || !playerOpen) return;
                    frame.src = gameUrl;
                    $('loadingScreen').style.display = 'none';
                    startMusic(musicUrl);
                } catch (e) {
                    console.error(e);
                    if (token === openToken) $('loadingText').textContent = 'تعذر تحميل اللعبة. حاول مرة تانية.';
                }
            } else {
                loadTimeout = setTimeout(() => {
                    if (!playerOpen || token !== openToken) return;
                    frame.src = linkUrl;
                    $('loadingScreen').style.display = 'none';
                }, 1000);
            }
        }

        function closePlayer() {
            openToken++;
            playerOpen = false;
            currentGame = null;
            playReady = false;
            stopTimer();
            stopMusic();
            clearTimeout(loadTimeout);
            document.body.classList.remove('no-scroll');
            $('gameIframe').src = "about:blank";
            $('player-view').style.display = 'none';
            $('store-view').style.display = 'block';
        }
        $('exitGameBtn').addEventListener('click', closePlayer);
    </script>
</body>
